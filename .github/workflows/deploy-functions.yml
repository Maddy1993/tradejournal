      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_REGISTRY }}
          username: ${{ needs.setup.outputs.namespace }}/${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Extract function version
        id: version
        working-directory: backend/functions/sync-processor
        run: |
          VERSION=$(grep '^version:' func.yaml | awk '{print $2}')
          PATCH=$(echo $VERSION | cut -d. -f3)
