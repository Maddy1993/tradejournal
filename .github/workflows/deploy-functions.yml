          echo "📋 Function OCID: ${FUNC_OCID:-none}"

          if [ -z "$FUNC_OCID" ] || [ "$FUNC_OCID" = "null" ]; then
            echo "Creating new function: db-migrate"
            oci fn function create \
              --application-id "$APP_ID" \
              --display-name "db-migrate" \
              --image "$IMAGE" \
              --memory-in-mbs 512 \
              --timeout-in-seconds 300
          else
            echo "Updating existing function: db-migrate (ID: $FUNC_OCID)"
            oci fn function update \
              --function-id "$FUNC_OCID" \
              --image "$IMAGE" \
              --force
          fi
