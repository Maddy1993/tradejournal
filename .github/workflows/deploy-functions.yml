          echo "📋 Function OCID: ${FUNC_OCID:-none}"

          if [ -z "$FUNC_OCID" ] || [ "$FUNC_OCID" = "null" ]; then
            echo "Creating new function: health-check"
            oci fn function create \
              --application-id "$APP_ID" \
              --display-name "health-check" \
              --image "$IMAGE" \
