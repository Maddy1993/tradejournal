  deploy-db-migrate:
    name: Deploy db-migrate
    runs-on: ubuntu-latest
    needs: [setup, build-shared]
    if: needs.detect-changes.outputs.db-migrate == 'true' || needs.detect-changes.outputs.all == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download shared library
        uses: actions/download-artifact@v4
        with:
          name: functions-shared
          path: backend/functions/db-migrate/lib/

      - name: Generate version
        id: version
        run: |
          VERSION="0.0.$(date +%s)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_REGISTRY }}
          username: ${{ needs.setup.outputs.namespace }}/${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/functions/db-migrate
          push: true
          tags: ${{ needs.setup.outputs.registry }}/db-migrate:${{ steps.version.outputs.version }}
