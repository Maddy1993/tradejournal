          echo "📋 Image: $IMAGE"
          echo "📋 Function OCID: ${FUNC_OCID:-none}"

          if [ -z "$FUNC_OCID" ] || [ "$FUNC_OCID" = "null" ]; then
            echo "Creating new function: sync-processor"
            oci fn function create \
              --application-id "$APP_ID" \
              --display-name "sync-processor" \
              --image "$IMAGE" \
              --memory-in-mbs 256 \
              --timeout-in-seconds 120
          else
            echo "Updating existing function: sync-processor (ID: $FUNC_OCID)"
            oci fn function update \
              --function-id "$FUNC_OCID" \
              --image "$IMAGE" \
              --force
          fi

      - name: Commit version bump
        if: github.event_name == 'push'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add backend/functions/sync-processor/func.yaml
          git commit -m "chore: bump sync-processor to ${{ steps.version.outputs.version }}"
          git push

  deploy-health-check:
    name: Deploy health-check
    runs-on: ubuntu-latest
    needs: [detect-changes, setup]
    if: needs.detect-changes.outputs.health-check == 'true'
